# dsh --patch 用的 overlay，也可直接作为 profile 的 cordis.patch.yml 内容。
# 顶层必须是数组：每个元素是一条 loader patch entry，`insert` 里列出要插入的插件行。
# 实测基于 dsh 0.2.2-rc.1；写成顶层 `insert:` 对象会被 dsh 拒绝。
- insert:
    - id: dangerous-op-precheck
      name: 'dangerous-op-precheck'
      config:
        logDecisions: true
        rules:
          - id: rm-recursive
            match:
              tool: bash
              commandPattern: 'rm\s+-[a-z]*r|mkfs|dd\s+if='
            mode: ask
            checklist:
              - 已确认目标路径正确，不是根目录或重要数据目录
              - 已确认有可用的备份或回滚方案
              - 已确认本次删除范围不超出预期
          - id: deny-secrets
            match:
              tool: [write, edit]
              pathPattern: '\.env(\..*)?$|id_rsa|\.pem$'
            mode: block
            message: 拒绝写入敏感文件。如需修改，请手动操作或先临时调整配置。
