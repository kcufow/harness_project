# 发布两个插件包到 npm。
# 触发方式：推 vX.Y.Z tag，或在 GitHub Actions 里手动 workflow_dispatch。
# 需要仓库 secret NPM_TOKEN：npm Granular Access Token（All Packages + Read and write (publish and stage) + Bypass 2FA）。
# 2025-11 起 legacy/automation token 已移除；首发后建议迁移到 npm trusted publishing（OIDC，免长期 token）。
# 只在 GitHub 侧生效：Gitee 不触发 Actions；打 tag 前先 git push github master。
name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      # 只跑 check：上游 dsh-tools 传递依赖的 zod <4.6.6 会报 8 个 high，
      # 需等上游升级，不能用 npm audit fix --force 破坏与 dsh 的版本对齐。
      - run: npm run check
      # 根包 private，显式按 workspace 发布，避免误发容器包。
      - run: npm publish --workspace dangerous-op-precheck --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish --workspace skill-usage-audit --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
