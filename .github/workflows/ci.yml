# 注意：本仓库当前托管在 Gitee 私有仓库，GitHub Actions 不会触发。
# 需同步到 GitHub 公开仓库，或改用 Gitee Go 执行等效的 `npm ci && npm run check`。
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
