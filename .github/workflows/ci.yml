# 双远程：origin = Gitee 私有仓库（不触发 Actions），github = GitHub 公开仓库（触发 Actions）。
# 改完代码两边都要推：git push origin master && git push github master。
# 已在 kcufow/harness_project 的 master 上实测通过（run 43350271592）。
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
